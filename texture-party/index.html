<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>body { margin: 0; }</style>
<title>Texture Party 🎉</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: sticky square plotter bed on the left, instrument column on the right; tool tabs above; stacks on phones. */
:root {
  --bg: #f3f3f0;
  --surface: #e9e9e4;
  --ink: #1b1c1a;
  --muted: #6c6e68;
  --rule: #d2d3cc;
  --accent: #2f5bd3;
  --danger: #b23a2b;
  --font-ui: "Schibsted Grotesk", "Helvetica Neue", Arial, sans-serif;
  --font-data: "JetBrains Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #121312; --surface: #1c1d1c; --ink: #e4e4df; --muted: #8b8d86; --rule: #2c2e2b; --accent: #7d9cff; --danger: #f0806f;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #121312; --surface: #1c1d1c; --ink: #e4e4df; --muted: #8b8d86; --rule: #2c2e2b; --accent: #7d9cff; --danger: #f0806f;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--font-ui); font-size: 14px;
  padding: 0 clamp(16px, 4vw, 40px); padding-block: 0 48px;
}
.wrap { max-width: 1180px; margin: 0 auto; }
header.top {
  display: flex; align-items: baseline; justify-content: space-between; gap: 16px; flex-wrap: wrap;
  padding-block: 28px 0;
}
h1 { font-size: 22px; font-weight: 600; margin: 0; letter-spacing: -0.01em; }
.sub { color: var(--muted); font-size: 13px; }
nav.tabs { display: flex; gap: 24px; border-bottom: 1px solid var(--rule); margin-top: 20px; overflow-x: auto; }
nav.tabs button {
  appearance: none; background: none; border: 0; font: inherit; font-size: 14px; color: var(--muted);
  padding: 10px 0 12px; border-bottom: 2px solid transparent; margin-bottom: -1px; cursor: pointer; white-space: nowrap;
}
nav.tabs button:hover { color: var(--ink); }
nav.tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--ink); font-weight: 500; }

main.grid {
  display: grid; grid-template-columns: minmax(0, 1.3fr) minmax(0, 1fr); gap: clamp(20px, 4vw, 56px);
  padding-top: 28px; align-items: start;
}
@media (max-width: 860px) { main.grid { grid-template-columns: minmax(0, 1fr); } }
.stage { min-width: 0; position: sticky; top: calc(env(safe-area-inset-top, 0px) + 16px); }
@media (max-width: 860px) { .stage { position: static; } }
.bed { position: relative; width: 100%; max-width: 100%; aspect-ratio: 1 / 1; border: 1px solid var(--rule); }
.bed canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.bed.drag { outline: 2px dashed var(--accent); outline-offset: -8px; }
.drop-hint {
  position: absolute; inset: 0; display: grid; place-items: center; pointer-events: none;
  font-family: var(--font-data); font-size: 12px; color: var(--accent); background: color-mix(in srgb, var(--bg) 80%, transparent);
}
.meta {
  display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-top: 10px;
  font-family: var(--font-data); font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums;
}
.looks { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
.look { appearance: none; font: inherit; font-size: 13px; color: var(--ink); background: transparent; border: 1px solid var(--rule); padding: 7px 14px; cursor: pointer; }
.look:hover:not(:disabled) { border-color: var(--muted); }
.look[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.look:disabled { color: var(--muted); border-style: dashed; cursor: default; }
.actions { display: flex; gap: 20px; flex-wrap: wrap; margin-top: 16px; align-items: center; }
.dlpng { display: inline-flex; gap: 8px; align-items: center; }
.dlpng select { font-size: 12px; padding: 3px 6px; }
.toast { font-size: 12px; color: var(--accent); min-height: 1em; margin: 8px 0 0; }
.about { margin-top: 20px; color: var(--muted); line-height: 1.6; max-width: 65ch; font-size: 13px; }

.panel { min-width: 0; display: flex; flex-direction: column; gap: 30px; }
.section { display: flex; flex-direction: column; gap: 14px; }
.section h2 { margin: 0; font-size: 11px; font-weight: 500; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
.section h2 small { text-transform: none; letter-spacing: 0; font-weight: 400; margin-left: 6px; }

/* Slots */
.slots { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.slot { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.slot-thumb {
  appearance: none; border: 1px solid var(--rule); background: transparent; aspect-ratio: 1 / 1; width: 100%;
  padding: 12px; cursor: pointer; display: grid; place-items: center; position: relative; color: var(--muted); font: inherit; font-size: 11px;
}
.slot-thumb:hover { border-color: var(--muted); }
.slot-thumb[aria-pressed="true"] { border-color: var(--ink); background: var(--surface); }
.slot-thumb canvas { width: 100%; height: 100%; display: block; }
.slot-num { position: absolute; top: 5px; left: 7px; font-family: var(--font-data); font-size: 10px; color: var(--muted); }
.slot-name { font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.slot-actions { display: flex; flex-wrap: wrap; gap: 4px 10px; font-size: 12px; }
.slot-actions button { appearance: none; background: none; border: 0; padding: 0; font: inherit; color: var(--muted); cursor: pointer; text-decoration: underline; text-underline-offset: 3px; }
.slot-actions button:hover { color: var(--ink); }
.slot select { width: 100%; font-size: 12px; padding: 4px 6px; }
.pastebox textarea { width: 100%; font-family: var(--font-data); font-size: 11px; background: var(--surface); color: var(--ink); border: 1px solid var(--rule); padding: 8px; }

.btn { appearance: none; font: inherit; font-size: 13px; color: var(--ink); background: var(--surface); border: 1px solid var(--rule); padding: 7px 12px; cursor: pointer; }
.btn:hover { border-color: var(--muted); }
.linkbtn { appearance: none; background: none; border: 0; padding: 0 0 3px; font: inherit; font-size: 13px; color: var(--ink); border-bottom: 1px solid var(--ink); cursor: pointer; }
.linkbtn:hover { color: var(--accent); border-color: var(--accent); }
.hint { font-size: 12px; color: var(--muted); line-height: 1.5; margin: 0; }
.err { font-size: 12px; color: var(--danger); margin: 0; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* Controls */
.ctl { display: grid; grid-template-columns: minmax(0, 1fr) 64px; column-gap: 14px; row-gap: 6px; }
.ctl label { grid-column: 1 / -1; font-size: 13px; font-weight: 500; display: flex; justify-content: space-between; gap: 8px; }
.ctl output { font-family: var(--font-data); font-size: 11px; color: var(--muted); text-align: right; align-self: center; font-variant-numeric: tabular-nums; }
.ctl.dbl { cursor: default; }
.rng { position: relative; min-width: 0; }
.rng input { position: relative; z-index: 1; display: block; }
.rng .tick { position: absolute; top: 2px; width: 1px; height: 14px; background: var(--muted); pointer-events: none; }
input[type="range"] { -webkit-appearance: none; appearance: none; width: 100%; height: 18px; background: transparent; margin: 0; cursor: pointer; }
input[type="range"]::-webkit-slider-runnable-track { height: 1px; background: var(--muted); }
input[type="range"]::-moz-range-track { height: 1px; background: var(--muted); }
input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; width: 14px; height: 14px; border-radius: 50%; background: var(--bg); border: 1.5px solid var(--ink); margin-top: -7px; }
input[type="range"]::-moz-range-thumb { width: 12px; height: 12px; border-radius: 50%; background: var(--bg); border: 1.5px solid var(--ink); }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.row > .lbl { font-size: 13px; font-weight: 500; min-width: 96px; }
select { font: inherit; font-size: 13px; color: var(--ink); background: var(--surface); border: 1px solid var(--rule); padding: 6px 8px; }
input[type="number"] { font-family: var(--font-data); font-size: 12px; width: 90px; color: var(--ink); background: var(--surface); border: 1px solid var(--rule); padding: 6px 8px; }
input[type="color"] { width: 34px; height: 30px; padding: 2px; border: 1px solid var(--rule); background: var(--surface); cursor: pointer; }
.toggle { display: flex; align-items: center; gap: 10px; font-size: 13px; cursor: pointer; }
.toggle input { accent-color: var(--ink); width: 15px; height: 15px; margin: 0; }
.chips { display: flex; gap: 6px; }
.chip { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; border: 1px solid var(--rule); padding: 5px 9px; cursor: pointer; }
.chip input { accent-color: var(--ink); margin: 0; }
.tag3d { font-family: var(--font-data); font-size: 9px; letter-spacing: 0.06em; border: 1px solid var(--rule); padding: 1px 5px; color: var(--muted); }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<div class="wrap">
  <header class="top">
    <h1>Texture Party 🎉</h1>
    <span class="sub">Textures, extrusions and flow fields built from your own SVGs</span>
  </header>
  <nav class="tabs" role="tablist" id="tabs">
    <button role="tab" data-tab="texture" id="tab-texture">Texture</button>
    <button role="tab" data-tab="extrude" id="tab-extrude">Iso Extrude</button>
    <button role="tab" data-tab="iso" id="tab-iso" hidden>Isometric Field</button>
    <button role="tab" data-tab="cubes" id="tab-cubes" hidden>Cube Grid</button>
    <button role="tab" data-tab="flow" id="tab-flow">Flow Field</button>
  </nav>

  <main class="grid">
    <section class="stage">
      <div class="bed" id="bed">
        <canvas id="cv" aria-label="Generated pattern"></canvas>
        <div class="drop-hint" id="dropHint" hidden>Drop SVG into the selected slot</div>
      </div>
      <div class="meta"><span id="stats">–</span><span id="renderMs"></span></div>
      <div class="looks" id="looks" role="group" aria-label="Texture presets"></div>
      <div class="actions">
        <button class="linkbtn" id="copySvg" type="button">Copy as SVG</button>
        <button class="linkbtn" id="copyPng" type="button">Copy as PNG</button>
        <button class="linkbtn" id="dlSvg" type="button">Download SVG</button>
        <span class="dlpng"><button class="linkbtn" id="dlPng" type="button">Download PNG</button>
          <select id="pngSize" aria-label="PNG size"><option value="1000">1000 px</option><option value="2000" selected>2000 px</option><option value="4000">4000 px</option></select></span>
        <button class="linkbtn" id="resetTab" type="button">Reset this tool</button>
        <button class="linkbtn" id="copySettings" type="button">Copy settings</button>
      </div>
      <p class="toast" id="toast" aria-live="polite"></p>
      <p class="about" id="about"></p>
    </section>

    <aside class="panel">
      <div class="section">
        <h2>Shape slots <small>click a slot to make it the drop and paste target</small></h2>
        <div class="slots" id="slots"></div>
        <div class="pastebox" id="pasteBox" hidden>
          <textarea id="pasteTa" rows="5" placeholder="&lt;svg viewBox=&quot;0 0 100 100&quot;&gt;…&lt;/svg&gt;"></textarea>
          <div class="row" style="margin-top:8px">
            <button class="btn" id="pasteUse" type="button">Use in slot 1</button>
            <button class="btn" id="pasteCancel" type="button">Cancel</button>
          </div>
        </div>
        <div class="row"><button class="linkbtn" id="resetSlots" type="button">Reset slots to defaults</button></div>
        <p class="err" id="err" hidden></p>
        <input type="file" id="fileIn" accept=".svg,image/svg+xml" hidden>
      </div>

      <div id="controls" class="panel" style="gap:30px"></div>

      <div class="section">
        <h2>Colors</h2>
        <label class="toggle"><input type="checkbox" id="c-page"> Use page colors</label>
        <div class="row" id="c-custom">
          <span class="lbl">Paper</span><input type="color" id="c-paper" aria-label="Paper color">
          <span class="lbl" style="min-width:auto">Ink</span><input type="color" id="c-ink" aria-label="Ink color">
        </div>
        <label class="toggle"><input type="checkbox" id="c-per"> Give each slot its own color</label>
        <div class="row" id="c-perRow">
          <span class="lbl">Slot 2</span><input type="color" id="c-s2" aria-label="Slot 2 color">
          <span class="lbl" style="min-width:auto">Slot 3</span><input type="color" id="c-s3" aria-label="Slot 3 color">
        </div>
        <label class="toggle"><input type="checkbox" id="c-keep"> Keep each SVG's own colors</label>
      </div>
    </aside>
  </main>
</div>

<script>
(() => {
'use strict';
const $ = (id) => document.getElementById(id);
const TAU = Math.PI * 2, D2R = Math.PI / 180;
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const fract = (v) => v - Math.floor(v);

// ---------------- Presets ----------------
const starPath = (() => { let d = ''; for (let i = 0; i < 10; i++) { const r = i % 2 ? 19 : 46, a = -Math.PI / 2 + i * Math.PI / 5; d += (i ? 'L' : 'M') + (50 + r * Math.cos(a)).toFixed(1) + ' ' + (52 + r * Math.sin(a)).toFixed(1); } return d + 'Z'; })();
const PRESETS = {
  leadOutline: { name: 'Lead Outline', svg: '<svg width="72" height="72" viewBox="0 0 72 72" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M48.5 0H27.5L0 27.5H44.5V72L72 44.5V0H48.5ZM65.17 4L48.5 20.67V4H65.17ZM27.5 23.5H9.66L29.16 4H44.5V23.5H27.5ZM68 42.84L48.5 62.34V27.5H68V42.84ZM51.33 23.5L68 6.83V23.5H51.33Z" fill="white"/></svg>' },
  leadSolid:   { name: 'Lead Solid',   svg: '<svg width="59" height="59" viewBox="0 0 59 59" fill="none" xmlns="http://www.w3.org/2000/svg"><path opacity="0.96" d="M36.2405 36.2404V58.6363L58.6363 36.2404V22.3958H36.2405V36.2404Z" fill="white"/><path opacity="0.56" d="M22.3958 0L0 22.3958H22.3958H36.2405V0H22.3958Z" fill="white"/><path opacity="0.68" d="M36.2405 0V22.3958L58.6363 0H36.2405Z" fill="white"/><path opacity="0.84" d="M36.2405 22.3958H58.6363V0L36.2405 22.3958Z" fill="white"/></svg>' },
  leaf:    { name: 'Leaf',    svg: '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 40"><path d="M2 20C26 -2 74 -2 98 20C74 42 26 42 2 20Z" fill="#000"/></svg>' },
  ring:    { name: 'Ring',    svg: '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><circle cx="50" cy="50" r="38" fill="none" stroke="#000" stroke-width="10"/></svg>' },
  cross:   { name: 'Cross',   svg: '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><path d="M50 10V90M10 50H90" stroke="#000" stroke-width="12" stroke-linecap="round"/></svg>' },
  line:    { name: 'Line',    svg: '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 10"><line x1="5" y1="5" x2="95" y2="5" stroke="#000" stroke-width="5.5" stroke-linecap="round"/></svg>' },
  arrow:   { name: 'Arrow',   svg: '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 40"><path d="M4 20H92M74 6L94 20L74 34" fill="none" stroke="#000" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/></svg>' },
  wedge:   { name: 'Wedge',   svg: '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 60"><path d="M2 4L98 30L2 56Z" fill="#000"/></svg>' },
  chevron: { name: 'Chevron', svg: '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 60"><path d="M8 8L50 50L92 8" fill="none" stroke="#000" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/></svg>' },
  square:  { name: 'Square',  svg: '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><rect x="12" y="12" width="76" height="76" fill="#000"/></svg>' },
  dot:     { name: 'Dot',     svg: '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><circle cx="50" cy="50" r="40" fill="#000"/></svg>' },
  star:    { name: 'Star',    svg: `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><path d="${starPath}" fill="#000"/></svg>` },
};

// ---------------- Tool schemas ----------------
const MODE = { k: 'mode', t: 'select', label: 'Line Style', hide: true, def: 'original', opts: [['original', 'As drawn'], ['outline', 'Outline only'], ['bold', 'Bold (thicken fills)']] };
const THICK = { k: 'thickness', t: 'range', label: 'Line Thickness', hide: true, min: 0, max: 20, step: 0.25, def: 0, fmt: (v) => v == 0 ? 'SVG' : (+v).toFixed(2) + '%' };
const ANIM = [{ k: 'anim', t: 'check', label: 'Animate', def: false }, { k: 'speed', t: 'range', label: 'Speed', min: 0.01, max: 1, step: 0.01, def: 0.2, when: (p) => p.anim }];

const SCHEMA = {
  texture: [
    { group: 'Shapes' },
    { k: 'use', t: 'slots', label: 'Shapes in pattern', def: [true, false, false] },
    { k: 'order', t: 'select', label: 'Arrangement', def: 'checker', opts: [['checker', 'Checkerboard'], ['sequence', 'Sequence'], ['row', 'By row'], ['col', 'By column'], ['random', 'Random']] },
    { k: 'size', t: 'range', label: 'Shape Size', min: 4, max: 400, step: 1, def: 22, fmt: (v) => v + ' u' },
    THICK, MODE,
    { group: 'Grid' },
    { k: 'spacing', t: 'range', label: 'Distance Between Shapes', min: 12, max: 240, step: 1, def: 30, fmt: (v) => v + ' u' },
    { k: 'rowOffset', t: 'range', label: 'Row Offset', min: 0, max: 100, step: 1, def: 50, fmt: (v) => v + '%' },
    { k: 'colOffset', t: 'range', label: 'Column Offset', min: 0, max: 100, step: 1, def: 0, fmt: (v) => v + '%' },
    { t: 'hint', text: 'Offsets shift each row (or column) by a share of the spacing. 50% makes a brick layout; other values make diagonals.' },
    { k: 'rot', t: 'range', label: 'Rotation', min: 0, max: 360, step: 1, def: 0, fmt: (v) => v + '°' },
    { k: 'rotRow', t: 'range', label: 'Rotation per Row', min: -90, max: 90, step: 0.5, def: -18, fmt: (v) => v + '°' },
    { k: 'rotCol', t: 'range', label: 'Rotation per Column', min: -90, max: 90, step: 0.5, def: -18.5, fmt: (v) => v + '°' },
    { group: 'Ramps' },
    { k: 'rampDir', t: 'select', label: 'Ramp Direction', def: 'diagonal', opts: [['horizontal', 'Left to right'], ['vertical', 'Top to bottom'], ['diagonal', 'Diagonal'], ['radial', 'From center']] },
    { k: 'sizeRamp', t: 'range', label: 'Size Ramp', min: -100, max: 100, step: 1, def: -66, fmt: (v) => v + '%' },
    { k: 'scaleRamp', t: 'range', label: 'Scale Ramp', min: -100, max: 100, step: 1, def: 5, fmt: (v) => v + '%' },
    { t: 'hint', text: 'Size Ramp grows the shapes along the ramp while the grid stays even. Scale Ramp squeezes the whole grid toward one side, so spacing and size change together like a zoom.' },
    { group: 'Depth', tag: '3D' },
    { k: 'tilt', t: 'range', label: 'Perspective Tilt', min: 0, max: 75, step: 0.5, def: 14, fmt: (v) => v + '°' },
    { k: 'waveAmp', t: 'range', label: 'Wave Height', min: 0, max: 300, step: 1, def: 52, fmt: (v) => v + ' u' },
    { k: 'waveFreq', t: 'range', label: 'Wave Frequency', min: 0.25, max: 10, step: 0.05, def: 2.45, when: (p) => p.waveAmp > 0 },
    { k: 'bulge', t: 'range', label: 'Sphere Bulge', min: -100, max: 100, step: 1, def: 0, fmt: (v) => v + '%' },
    { k: 'twist', t: 'range', label: 'Vortex Twist', min: -360, max: 360, step: 1, def: -1, fmt: (v) => v + '°' },
    { k: 'extrude', t: 'range', label: 'Extrude Depth', min: 0, max: 60, step: 0.5, def: 0, fmt: (v) => v + ' u' },
    { k: 'extrudeAngle', t: 'range', label: 'Extrude Angle', min: 0, max: 360, step: 1, def: 135, fmt: (v) => v + '°', when: (p) => p.extrude > 0 },
    { k: 'fog', t: 'range', label: 'Depth Fog', min: 0, max: 100, step: 1, def: 49, fmt: (v) => v + '%' },
    { t: 'hint', text: 'Tilt lays the texture on a receding floor. Wave Height lifts it into ripples (visible with tilt, or as pulsing size without). Extrude stacks shaded copies behind each shape. Fog fades the far side.' },
    { group: 'Motion' }, ...ANIM,
    { k: 'seed', t: 'seed', label: 'Seed', def: 7, when: (p) => p.order === 'random' },
  ],
  iso: [
    { group: 'Source' },
    { k: 'source', t: 'select', label: 'Height Source', def: 'noise', opts: [['noise', 'Noise terrain'], ['mask', 'SVG shape, extruded'], ['dome', 'SVG shape, domed'], ['maskNoise', 'SVG shape × noise']] },
    { k: 'maskSlot', t: 'slot', label: 'Shape slot', def: 1, noNone: true, when: (p) => p.source !== 'noise' },
    { k: 'maskDepth', t: 'range', label: 'Dome Width', min: 1, max: 16, step: 0.5, def: 4, fmt: (v) => v + ' blocks', when: (p) => p.source === 'dome' },
    { k: 'outside', t: 'select', label: 'Outside shape', def: 'hide', opts: [['hide', 'Empty'], ['floor', 'Flat floor'], ['noise', 'Low noise terrain']], when: (p) => p.source !== 'noise' },
    { k: 'invert', t: 'check', label: 'Invert shape', def: false, when: (p) => p.source !== 'noise' },
    { t: 'hint', text: 'The slot is rasterized onto the grid: each block inside the shape becomes a column. Raise Grid Dimension for a sharper silhouette.', when: (p) => p.source !== 'noise' },

  navigator.clipboard.writeText(txt).then(
    () => toast('Settings copied. Paste them in chat to turn them into a preset.'),
    () => { $('pasteBox').hidden = false; $('pasteTa').value = txt; $('pasteTa').select(); toast('Clipboard was blocked. The settings are selected in the box under the slots; press Cmd/Ctrl+C.'); });
});
$('resetTab').addEventListener('click', () => { state.p[state.tab] = defaultsFor(state.tab); time = 0; save(); buildControls(); requestRender(); toast('Tool settings reset. Your slots were kept.'); });

// ---------------- Export ----------------
let toastTimer;
function toast(msg) { $('toast').textContent = msg; clearTimeout(toastTimer); toastTimer = setTimeout(() => ($('toast').textContent = ''), 3000); }
$('copySvg').addEventListener('click', () => {
  const sp = svgPainter(); DRAW[state.tab](sp, P(), palette(), time);
  const s = sp.finish();
  navigator.clipboard.writeText(s).then(
    () => toast(`SVG copied (${sp.count.toLocaleString()} elements). Paste into Figma, Illustrator or a .svg file.`),
    () => { $('pasteBox').hidden = false; $('pasteTa').value = s; $('pasteTa').select(); $('pasteUse').textContent = 'Use in slot ' + (pasteTarget + 1); toast('Clipboard was blocked. The SVG is selected in the box under the slots; press Cmd/Ctrl+C.'); });
});
function exportCanvas(px) {
  const c = document.createElement('canvas'); c.width = px; c.height = px;
  DRAW[state.tab](canvasPainter(c.getContext('2d'), px / 1000, true), P(), palette(), time);
  return c;
}
$('copyPng').addEventListener('click', () => {
  const c = exportCanvas(Math.max(1000, cv.width));
  try {
    const item = new ClipboardItem({ 'image/png': new Promise((res) => c.toBlob(res, 'image/png')) });
    navigator.clipboard.write([item]).then(() => toast('PNG copied to the clipboard.'), () => toast('Clipboard was blocked. Right-click the pattern and choose Save Image instead.'));
  } catch (_) { toast('Clipboard was blocked. Right-click the pattern and choose Save Image instead.'); }
});
const stamp = () => new Date().toISOString().slice(0, 19).replace(/[-:]/g, '').replace('T', '-');
function download(blob, ext) {
  const name = `texture-party-${state.tab}-${stamp()}.${ext}`;
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  return name;
}
$('dlSvg').addEventListener('click', () => {
  const sp = svgPainter(); DRAW[state.tab](sp, P(), palette(), time);
  const name = download(new Blob([sp.finish()], { type: 'image/svg+xml' }), 'svg');
  toast(`Saved ${name} (${sp.count.toLocaleString()} elements).`);
});
$('dlPng').addEventListener('click', () => {
  const px = +$('pngSize').value;
  const c = exportCanvas(px);
  c.toBlob((b) => {
    if (!b) { toast('PNG export failed. Try a smaller size.'); return; }
    toast(`Saved ${download(b, 'png')} (${px} × ${px} px).`);
  }, 'image/png');
});

// ---------------- Theme + resize ----------------
const onTheme = () => { requestRender(); refreshThumbs(); };
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', onTheme);
new MutationObserver(onTheme).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });
new ResizeObserver(requestRender).observe(bed);

// ---------------- Boot ----------------
restore();
const hashTab = (location.hash || '').slice(1);
if (tabOk(hashTab)) state.tab = hashTab;
if (matchMedia('(prefers-reduced-motion: reduce)').matches) for (const t in state.p) state.p[t].anim = false;
buildSlots(); syncColorsUi(); buildControls(); buildLooks(); render(); syncAnim();
document.fonts?.ready.then(requestRender);
})();
</script>
