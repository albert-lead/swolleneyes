<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- Keep this page out of search results; it is shared by link only. -->
<meta name="robots" content="noindex, nofollow">
<title>glyphbomb embed</title>
<style>
  :root {
    --bg-top: #67779e;
    --bg-bottom: #9bb1cc;
    --bg-warm: #b3b0bf;
    --menu-ink: #3b4b75;
    --menu-ink-soft: #6d7ca6;
    --page: #17181b;
  }
  html, body { margin: 0; }
  body {
    background: var(--page);
    font: 16px/1.6 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    color: #2a2d33;
  }

  /* Stand-in article page around the hero card, so the embed can be judged
     in context. */
  .article {
    max-width: 1280px;
    margin: 48px auto;
    padding: 48px 56px 64px;
    background: #fff;
    border-radius: 40px;
  }
  .meta { display: grid; grid-template-columns: 240px 1fr; gap: 24px; margin-top: 56px; }
  .meta time { font-size: 13px; color: #555; }
  .meta p { margin: 0; max-width: 720px; }
  @media (max-width: 720px) {
    .article { margin: 16px; padding: 16px 16px 32px; border-radius: 24px; }
    .meta { grid-template-columns: 1fr; }
  }

  /* The hero card. The effect fills it; the heading sits on top as real text. */
  .hero {
    position: relative;
    height: min(62vh, 640px);
    min-height: 360px;
    border-radius: 32px;
    overflow: hidden;
    background:
      radial-gradient(60% 50% at 0% 90%, var(--bg-warm) 0%, transparent 70%),
      linear-gradient(180deg, var(--bg-top) 0%, var(--bg-bottom) 75%);
    cursor: crosshair;
    isolation: isolate;
  }
  .hero-title {
    position: absolute;
    left: 56px;
    bottom: 48px;
    margin: 0;
    max-width: 60%;
    font-size: clamp(32px, 6vw, 72px);
    line-height: 1.05;
    font-weight: 400;
    color: #fff;
    pointer-events: none;
    z-index: 2;
  }

  /* Controls, bottom right of the card, as far from the bottom as the full
     page button is from the top. A two-column grid: keys in the
     first column, right-aligned to it, and labels in the second. The groups
     and rows use subgrid so every row shares the same columns. */
  .controls {
    position: absolute;
    bottom: 20px;
    right: 20px;
    display: grid;
    grid-template-columns: auto auto;
    row-gap: 12px;
    z-index: 3;
  }
  .controls, .expand {
    font: 12px/1.3 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    color: rgba(255, 255, 255, 0.9);
    user-select: none;
  }
  .menu, .actions, .menu button, .action {
    grid-column: 1 / -1;
    display: grid;
    grid-template-columns: subgrid;
    align-items: center;
    column-gap: 8px;
  }
  .menu, .actions { row-gap: 8px; }
  .controls .divider {
    grid-column: 1 / -1;
    border-top: 1px dotted rgba(255, 255, 255, 0.6);
  }
  .controls .keys { justify-self: end; display: flex; align-items: center; gap: 8px; }
  .menu button, .expand {
    padding: 0;
    border: 0;
    background: transparent;
    color: inherit;
    font: inherit;
    text-align: left;
    cursor: pointer;
  }
  .expand { display: flex; align-items: center; gap: 8px; }
  .menu button:hover, .expand:hover { color: #fff; }
  .menu button[aria-pressed="true"] { color: #fff; font-weight: 600; }
  .action .plus { margin: 0 -4px; opacity: 0.7; }
  .controls kbd, .expand kbd {
    display: inline-grid;
    place-items: center;
    min-width: 18px;
    box-sizing: border-box;
    height: 18px;
    padding: 0 6px;
    border: 1px solid currentColor;
    border-radius: 4px;
    font: inherit;
    font-size: 11px;
    font-weight: 400;
    position: relative;
    transition: border-color 140ms ease;
  }
  .controls kbd .k-label { transition: opacity 140ms ease; }
  .controls kbd svg {
    position: absolute; inset: -1px; width: calc(100% + 2px); height: calc(100% + 2px);
    opacity: 0; transition: opacity 140ms ease; pointer-events: none;
  }
  /* Lit keys: a white fill with the letters cut out. Actions flash; an
     active mode stays lit. */
  .controls kbd.fire, .controls kbd.on { border-color: transparent; transition: none; }
  .controls kbd.fire .k-label, .controls kbd.on .k-label { opacity: 0; transition: none; }
  .controls kbd.fire svg, .controls kbd.on svg { opacity: 1; transition: none; }

  /* Full page, top right of the card. */
  .expand {
    position: absolute;
    top: 20px;
    right: 20px;
    z-index: 3;
    color: rgba(255, 255, 255, 0.9);
  }
  .expand kbd { padding: 0 4px; }
  .expand kbd svg { width: 10px; height: 10px; }
  .expand .when-open { display: none; }
  .hero.expanded .expand .when-open { display: inline-flex; }
  .hero.expanded .expand .when-closed { display: none; }

  .hero.expanded {
    position: fixed;
    inset: 0;
    height: auto;
    min-height: 0;
    border-radius: 0;
    z-index: 100;
  }
  body.locked { overflow: hidden; }
  @media (max-width: 720px) { .actions { display: none; } }
</style>
</head>
<body>
<main class="article">
  <section class="hero" id="hero" aria-label="Hero">
    <h1 class="hero-title">Headline goes<br>right here</h1>
    <button type="button" class="expand" aria-pressed="false">
      <span class="when-closed">Full page</span>
      <kbd class="when-closed" aria-hidden="true"><svg viewBox="0 0 10 10" fill="none" stroke="currentColor" stroke-width="1.2"><path d="M6 1h3v3M4 9H1V6M9 1 6 4M1 9l3-3"/></svg></kbd>
      <span class="when-open">Exit</span>
      <kbd class="when-open">esc</kbd>
    </button>
    <div class="controls">
      <div class="menu" aria-label="Modes">
        <button type="button" data-mode="repulse" aria-pressed="false">
          <span class="keys"><kbd><span class="k-label">z</span></kbd></span><span>Repel</span>
        </button>
        <button type="button" data-mode="attract" aria-pressed="false">
          <span class="keys"><kbd><span class="k-label">x</span></kbd></span><span>Attract</span>
        </button>
      </div>
      <div class="divider" aria-hidden="true"></div>
      <div class="actions" aria-label="Actions">
        <div class="action"><span class="keys"><kbd id="k-shift"><span class="k-label">shift</span></kbd><span class="plus">+</span><kbd id="k-click"><span class="k-label">click</span></kbd></span><span>Stamp</span></div>
        <div class="action"><span class="keys"><kbd id="k-space"><span class="k-label">space</span></kbd></span><span>Rage</span></div>
        <div class="action"><span class="keys"><kbd id="k-scroll"><span class="k-label">scroll</span></kbd></span><span>Wind</span></div>
      </div>
    </div>
  </section>
  <div class="meta">
    <time>Date</time>
    <p>Placeholder body copy. This page stands in for the article the hero card
    sits in, so the embed can be seen at its real size and position.</p>
  </div>
</main>

<script src="../engine.js"></script>
<script>
  // Embed: the effect inside a hero card. Shortcuts and scroll-wind only work
  // while the pointer is over the card, so the rest of the page scrolls and
  // types as normal.
  const hero = document.getElementById('hero');
  const gb = Glyphbomb.mount(hero, {
    keys: window,
    keysWhen: 'hover',
    wheel: hero,
    config: { spacing: 18 },
  });
  // The canvas sits behind the heading and the controls.
  hero.querySelector('canvas').style.zIndex = '1';

  // Mode buttons.
  const buttons = [...document.querySelectorAll('.menu [data-mode]')];
  buttons.forEach(btn => btn.addEventListener('click', () => { gb.toggleMode(btn.dataset.mode); btn.blur(); }));
  const updateMenu = () => buttons.forEach(btn => {
    const on = gb.mode === btn.dataset.mode;
    btn.setAttribute('aria-pressed', String(on));
    btn.querySelector('kbd').classList.toggle('on', on);
  });
  gb.on('change', updateMenu);
  updateMenu();

  // Action keys: a white fill with the letters cut out, lit as actions fire.
  document.querySelectorAll('.controls kbd').forEach((kbd, n) => {
    const r = kbd.getBoundingClientRect();
    const wv = r.width + 2, hv = r.height + 2, id = 'ko' + n;
    const txt = kbd.textContent.trim();
    const cs = getComputedStyle(kbd);
    kbd.insertAdjacentHTML('beforeend',
      `<svg viewBox="0 0 ${wv} ${hv}" aria-hidden="true"><defs><mask id="${id}">` +
      `<rect width="${wv}" height="${hv}" rx="5" fill="#fff"/>` +
      `<text x="50%" y="50%" text-anchor="middle" dominant-baseline="central" fill="#000" ` +
      `style="font-family:${cs.fontFamily.replace(/"/g, "'")};font-size:${cs.fontSize}">${txt}</text>` +
      `</mask></defs><rect width="${wv}" height="${hv}" rx="5" fill="#fff" mask="url(#${id})"/></svg>`);
  });
  function flash(id) {
    const el = document.getElementById(id);
    el.classList.remove('fire');
    el.offsetWidth;
    el.classList.add('fire');
    clearTimeout(el._t);
    el._t = setTimeout(() => el.classList.remove('fire'), 50);
  }
  gb.on('action', a => { const id = { click: 'k-click', space: 'k-space' }[a]; if (id) flash(id); });
  gb.on('shift', on => document.getElementById('k-shift').classList.toggle('fire', on));
  gb.on('scrolling', on => document.getElementById('k-scroll').classList.toggle('fire', on));

  // Full page: the card grows to fill the window and Esc brings it back.
  // Esc is caught before the engine sees it, so it closes instead of resetting.
  const expandBtn = hero.querySelector('.expand');
  function setExpanded(on) {
    hero.classList.toggle('expanded', on);
    document.body.classList.toggle('locked', on);
    expandBtn.setAttribute('aria-pressed', String(on));
  }
  expandBtn.addEventListener('click', () => { setExpanded(!hero.classList.contains('expanded')); expandBtn.blur(); });
  window.addEventListener('keydown', e => {
    if (e.key === 'Escape' && hero.classList.contains('expanded')) {
      e.stopImmediatePropagation();
      setExpanded(false);
    }
  }, true);

  // Pause while the card is scrolled out of view.
  new IntersectionObserver(([e]) => { e.isIntersecting ? gb.resume() : gb.pause(); }).observe(hero);
</script>
</body>
</html>
