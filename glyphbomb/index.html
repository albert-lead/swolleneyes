<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- Keep this page out of search results; it is shared by link only. -->
<meta name="robots" content="noindex, nofollow">
<title>glyphbomb</title>
<style>
  :root {
    --bg-top: #67779e;
    --bg-bottom: #9bb1cc;
    --bg-warm: #b3b0bf;
  }
  html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
  }
  body {
    background:
      radial-gradient(60% 50% at 0% 90%, var(--bg-warm) 0%, transparent 70%),
      linear-gradient(180deg, var(--bg-top) 0%, var(--bg-bottom) 75%);
    cursor: crosshair;
  }
  /* The effect fills the window. */
  #stage { position: fixed; inset: 0; }
  .menu, .tuning {
    display: flex;
    flex-direction: column;
    gap: 4px;
    padding: 8px;
    border-radius: 10px;
    background: rgba(255, 255, 255, 0.32);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    font: 12px/1.3 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    /* Dark ink for values, titles and active rows; a much lighter tint of
       the page blue for labels and inactive rows. */
    --menu-ink: #3b4b75;
    --menu-ink-soft: #6d7ca6;
    color: var(--menu-ink-soft);
    user-select: none;
  }
  .menu { position: fixed; left: 16px; bottom: 16px; }
  /* Frame rate readout, top left, in a darker shade of the panels' ink. */
  .fps {
    position: fixed;
    top: 16px;
    left: 16px;
    font: 12px/1 ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    color: #2f3d62;
    font-variant-numeric: tabular-nums;
    user-select: none;
    pointer-events: none;
  }
  /* Settings panels stack on the right, each shown only while its mode is on. */
  .side {
    position: fixed;
    right: 16px;
    bottom: 16px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .tuning {
    width: 240px;
    gap: 0;
    padding: 12px;
  }
  .tuning[hidden] { display: none; }
  .tuning h2 { margin: 0; font: inherit; }
  /* The panel title doubles as its minimize / expand button. */
  .tuning-head {
    display: flex;
    align-items: center;
    width: 100%;
    padding: 0;
    border: 0;
    background: transparent;
    font: inherit;
    font-weight: 600;
    color: var(--menu-ink);
    text-align: left;
    cursor: pointer;
  }
  .tuning-head .chev {
    margin-left: auto;
    display: inline-grid;
    place-items: center;
    width: 18px;
    height: 18px;
    border-radius: 4px;
    font-size: 14px;
    line-height: 1;
  }
  .tuning-head:hover .chev { background: rgba(59, 75, 117, 0.1); }
  /* With neither Repulse nor Attract on, the panel is closed and its title
     faded and inert. */
  .tuning-head:disabled { opacity: 0.45; cursor: default; }
  .tuning-head:disabled:hover .chev { background: transparent; }
  /* Opens and closes smoothly by animating the row from 0 to its full height. */
  .tuning-body {
    display: grid;
    grid-template-rows: 0fr;
    opacity: 0;
    transition: grid-template-rows 320ms cubic-bezier(0.2, 0.7, 0.2, 1), opacity 240ms ease;
  }
  .tuning-body.open { grid-template-rows: 1fr; opacity: 1; }
  .tuning-inner { min-height: 0; overflow: hidden; }
  .tuning-group { display: flex; flex-direction: column; gap: 10px; padding-top: 10px; }
  .tuning-group[hidden] { display: none; }
  /* Temporary motion blur panel, top right, always open. */
  .dev-col {
    position: fixed;
    top: 16px;
    right: 16px;
    max-height: calc(100vh - 90px);
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .mb-panel { gap: 10px; }
  /* Size ramp panel, centre right. */
  .ramp-panel { gap: 10px; }
  .ramp-panel[hidden] { display: none; }
  /* Wind panel, top left under the frame rate. */
  .wind-panel { position: fixed; top: 40px; left: 16px; gap: 10px; max-height: calc(100vh - 140px); overflow-y: auto; }
  .wind-panel[hidden] { display: none; }
  .mb-panel[hidden] { display: none; }
  .mb-title { font-weight: 600; color: var(--menu-ink); }
  .mb-title span { font-weight: 400; color: var(--menu-ink-soft); }
  .mb-panel .switch-row { padding-top: 0; }
  /* On/off switch for 3D tumble, drawn as a small pill. */
  .tuning .switch-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding-top: 10px;
  }
  .switch-row input {
    -webkit-appearance: none;
    appearance: none;
    position: relative;
    width: 28px;
    height: 16px;
    margin: 0;
    border-radius: 8px;
    background: rgba(255, 255, 255, 0.55);
    cursor: pointer;
    transition: background 160ms ease;
  }
  .switch-row input::before {
    content: "";
    position: absolute;
    top: 2px;
    left: 2px;
    width: 12px;
    height: 12px;
    border-radius: 50%;
    background: var(--menu-ink);
    transition: transform 160ms ease, background 160ms ease;
  }
  .switch-row input:checked { background: var(--menu-ink); }
  .switch-row input:checked::before { transform: translateX(12px); background: #fff; }
  /* Switching modes: the new sliders fade in while the height eases. */
  .tuning-group { transition: opacity 260ms ease; }
  .tuning-group.entering { opacity: 0; }
  .tuning-inner.resizing { transition: height 320ms cubic-bezier(0.2, 0.7, 0.2, 1); }
  .tuning label {
    display: grid;
    grid-template-columns: 1fr auto;
    row-gap: 4px;
  }
  .tuning output {
    color: var(--menu-ink);
    font-variant-numeric: tabular-nums;
    font-weight: 600;
  }
  /* Sliders: a plain track with the filled part in the ink colour (set via
     --fill from script), and a round thumb, no borders or outlines. */
  .tuning input[type="range"] {
    grid-column: 1 / -1;
    width: 100%;
    height: 14px;
    margin: 0;
    background: transparent;
    -webkit-appearance: none;
    appearance: none;
    outline: none;
    cursor: pointer;
  }
  .tuning input[type="range"]::-webkit-slider-runnable-track {
    height: 4px;
    border: 0;
    border-radius: 2px;
    background: linear-gradient(var(--menu-ink), var(--menu-ink)) 0 / var(--fill, 0%) 100% no-repeat,
      rgba(255, 255, 255, 0.55);
  }
  .tuning input[type="range"]::-moz-range-track {
    height: 4px;
    border: 0;
    border-radius: 2px;
    background: rgba(255, 255, 255, 0.55);
  }
  .tuning input[type="range"]::-moz-range-progress {
    height: 4px;
    border-radius: 2px;
    background: var(--menu-ink);
  }
  .tuning input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 12px;
    height: 12px;
    margin-top: -4px;
    border: 0;
    border-radius: 50%;
    background: var(--menu-ink);
  }
  .tuning input[type="range"]::-moz-range-thumb {
    width: 12px;
    height: 12px;
    border: 0;
    border-radius: 50%;
    background: var(--menu-ink);
  }
  .tuning input[type="range"]:focus-visible::-webkit-slider-thumb {
    box-shadow: 0 0 0 3px rgba(59, 75, 117, 0.25);
  }
  .menu button {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 4px 6px;
    border: 0;
    border-radius: 6px;
    background: transparent;
    color: inherit;
    font: inherit;
    text-align: left;
    cursor: pointer;
  }
  .menu button:hover { background: rgba(59, 75, 117, 0.1); }
  .menu button[aria-pressed="true"] { color: var(--menu-ink); font-weight: 600; }
  .menu kbd {
    display: inline-grid;
    place-items: center;
    width: 18px;
    height: 18px;
    border: 1px solid currentColor;
    border-radius: 4px;
    font: inherit;
    font-size: 11px;
    text-transform: uppercase;
  }
  .menu button[aria-pressed="true"] kbd {
    background: var(--menu-ink);
    color: #fff;
    border-color: var(--menu-ink);
  }
  .menu .state { margin-left: auto; padding-left: 12px; }
  /* One-shot actions, bottom centre with no panel. Each key lights up when
     its action fires. */
  .actions {
    position: fixed;
    left: 0;
    right: 0;
    bottom: 20px;
    display: flex;
    justify-content: center;
    gap: 20px;
    font: 12px/1.3 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    color: rgba(255, 255, 255, 0.9);
    user-select: none;
    pointer-events: none;
  }
  .action { display: flex; align-items: center; gap: 8px; }
  .action .plus { margin: 0 -4px; opacity: 0.7; }
  .action kbd {
    display: inline-grid;
    place-items: center;
    height: 18px;
    padding: 0 6px;
    border: 1px solid currentColor;
    border-radius: 4px;
    font: inherit;
    font-size: 11px;
    position: relative;
    transition: border-color 140ms ease;
  }
  /* Lit state: a 50% white fill with the letters cut out of it (an SVG mask),
     drawn over the key. */
  .action kbd .k-label { transition: opacity 140ms ease; }
  .action kbd svg {
    position: absolute;
    inset: -1px;
    width: calc(100% + 2px);
    height: calc(100% + 2px);
    opacity: 0;
    transition: opacity 140ms ease;
    pointer-events: none;
  }
  .action kbd.fire { border-color: transparent; transition: none; }
  .action kbd.fire .k-label { opacity: 0; transition: none; }
  .action kbd.fire svg { opacity: 1; transition: none; }
</style>
</head>
<body>
<div id="stage"></div>
<div class="fps" id="fps" aria-hidden="true">-- fps</div>
<div class="menu" aria-label="Shortcuts">
  <button type="button" data-key="z" aria-pressed="false">
    <kbd>z</kbd><span>Repulse</span><span class="state">off</span>
  </button>
  <button type="button" data-key="x" aria-pressed="false">
    <kbd>x</kbd><span>Attract</span><span class="state">off</span>
  </button>
</div>
<div class="actions" aria-label="Actions">
  <div class="action"><kbd id="k-shift"><span class="k-label">shift</span></kbd><span class="plus">+</span><kbd id="k-click"><span class="k-label">click</span></kbd><span>Stamp</span></div>
  <div class="action"><kbd id="k-space"><span class="k-label">space</span></kbd><span>Rage</span></div>
  <div class="action"><kbd id="k-scroll"><span class="k-label">scroll</span></kbd><span>Wind</span></div>
  <div class="action"><kbd id="k-esc"><span class="k-label">esc</span></kbd><span>Reset</span></div>
</div>
<div class="side">
<div class="tuning" id="tuning" aria-label="Variables">
  <h2><button type="button" class="tuning-head" aria-expanded="false">Variables<span class="chev" aria-hidden="true">+</span></button></h2>
  <div class="tuning-body">
  <div class="tuning-inner">
    <label class="switch-row">
      <span>Orient (shapeTurns)</span>
      <input type="checkbox" id="orient" role="switch" checked>
    </label>
    <label class="switch-row">
      <span>3D tumble (tumble3d)</span>
      <input type="checkbox" id="tumble" role="switch">
    </label>
    <div class="tuning-group" data-mode="z" aria-label="Repulse variables">
      <label>
        <span>Blur start (blurStart)</span>
        <output data-for="blurStart"></output>
        <input type="range" data-config="blurStart" min="1.05" max="6" step="0.01" data-suffix="×" data-digits="2">
      </label>
      <label>
        <span>Throw growth (zScale)</span>
        <output data-for="zScale"></output>
        <input type="range" data-config="zScale" min="1" max="5" step="0.1">
      </label>
      <label>
        <span>Hit chance (hitChance)</span>
        <output data-for="hitChance"></output>
        <input type="range" data-config="hitChance" min="0" max="0.7" step="0.01" data-format="percent">
      </label>
      <label>
        <span>Plow growth (pushGrow)</span>
        <output data-for="pushGrow"></output>
        <input type="range" data-config="pushGrow" min="1" max="5" step="0.1">
      </label>
      <label>
        <span>Arrow size (avoidSize)</span>
        <output data-for="avoidSize"></output>
        <input type="range" data-config="avoidSize" min="50" max="400" step="5" data-digits="0" data-suffix="px">
      </label>
    </div>
    <div class="tuning-group" data-mode="x" aria-label="Attract variables" hidden>
      <label>
        <span>Reach (attractRadius)</span>
        <output data-for="attractRadius"></output>
        <input type="range" data-config="attractRadius" min="60" max="400" step="5" data-digits="0" data-suffix="px">
      </label>
      <label>
        <span>Capture chance (captureChance)</span>
        <output data-for="captureChance"></output>
        <input type="range" data-config="captureChance" min="0" max="1" step="0.01" data-format="percent">
      </label>
      <label>
        <span>Gravity (gravity)</span>
        <output data-for="gravity"></output>
        <input type="range" data-config="gravity" min="2000000" max="100000000" step="1000000" data-format="millions">
      </label>
      <label>
        <span>Swirl (orbit)</span>
        <output data-for="orbit"></output>
        <input type="range" data-config="orbit" min="0" max="1.2" step="0.05" data-digits="2">
      </label>
      <label>
        <span>Cling time (stuckMs)</span>
        <output data-for="stuckMs"></output>
        <input type="range" data-config="stuckMs" min="200" max="4000" step="50" data-digits="0" data-suffix="ms">
      </label>
      <label>
        <span>Escape speed (escapeSpeed)</span>
        <output data-for="escapeSpeed"></output>
        <input type="range" data-config="escapeSpeed" min="300" max="2000" step="25" data-digits="0">
      </label>
      <label>
        <span>Edge falloff (captureFalloff)</span>
        <output data-for="captureFalloff"></output>
        <input type="range" data-config="captureFalloff" min="0" max="1" step="0.05" data-format="percent">
      </label>
      <label>
        <span>Carry (carry)</span>
        <output data-for="carry"></output>
        <input type="range" data-config="carry" min="0" max="1" step="0.05" data-format="percent">
      </label>
      <label>
        <span>Max hold (captureMaxMs)</span>
        <output data-for="captureMaxMs"></output>
        <input type="range" data-config="captureMaxMs" min="1000" max="15000" step="250" data-digits="0" data-suffix="ms">
      </label>
      <label>
        <span>Cooldown (attractCooldown)</span>
        <output data-for="attractCooldown"></output>
        <input type="range" data-config="attractCooldown" min="100" max="8000" step="100" data-digits="0" data-suffix="ms">
      </label>
    </div>
  </div>
  </div>
</div>
</div>
<!-- Wind (scroll) tuning. -->
<div class="tuning wind-panel" id="wind-panel" aria-label="Wind" hidden>
  <h2 class="mb-title">Wind</h2>
  <label>
    <span>Strength per scroll (windGain)</span>
    <output data-for="windGain"></output>
    <input type="range" data-config="windGain" min="0.0005" max="0.015" step="0.0005" data-digits="4">
  </label>
  <label>
    <span>Fade while scrolling (windDecay)</span>
    <output data-for="windDecay"></output>
    <input type="range" data-config="windDecay" min="0" max="8" step="0.1">
  </label>
  <label>
    <span>Settle speed (windRecover)</span>
    <output data-for="windRecover"></output>
    <input type="range" data-config="windRecover" min="1" max="30" step="0.5">
  </label>
  <label>
    <span>Swing downwind (windTurn)</span>
    <output data-for="windTurn"></output>
    <input type="range" data-config="windTurn" min="0" max="2" step="0.05" data-digits="2">
  </label>
  <label>
    <span>Flutter (windFlutter)</span>
    <output data-for="windFlutter"></output>
    <input type="range" data-config="windFlutter" min="0" max="1.5" step="0.05" data-digits="2">
  </label>
  <label>
    <span>Flutter speed (windFlutterHz)</span>
    <output data-for="windFlutterHz"></output>
    <input type="range" data-config="windFlutterHz" min="0.2" max="10" step="0.1" data-suffix="Hz">
  </label>
  <label>
    <span>Curl (windCurl)</span>
    <output data-for="windCurl"></output>
    <input type="range" data-config="windCurl" min="0" max="3" step="0.05" data-digits="2">
  </label>
  <label>
    <span>Stretch (windStretch)</span>
    <output data-for="windStretch"></output>
    <input type="range" data-config="windStretch" min="0" max="2" step="0.05" data-digits="2">
  </label>
  <label>
    <span>Gust size (windGustSize)</span>
    <output data-for="windGustSize"></output>
    <input type="range" data-config="windGustSize" min="80" max="1500" step="10" data-digits="0" data-suffix="px">
  </label>
  <label>
    <span>Air speed (windSpeed)</span>
    <output data-for="windSpeed"></output>
    <input type="range" data-config="windSpeed" min="0" max="1500" step="10" data-digits="0">
  </label>
  <label>
    <span>Carry (windPush)</span>
    <output data-for="windPush"></output>
    <input type="range" data-config="windPush" min="0" max="12" step="0.1">
  </label>
  <label>
    <span>Turbulence (windTurbulence)</span>
    <output data-for="windTurbulence"></output>
    <input type="range" data-config="windTurbulence" min="0" max="2" step="0.05" data-digits="2">
  </label>
  <label>
    <span>Wall eddies (eddyStrength)</span>
    <output data-for="eddyStrength"></output>
    <input type="range" data-config="eddyStrength" min="0" max="4" step="0.05" data-digits="2">
  </label>
  <label>
    <span>Eddy width (eddySize)</span>
    <output data-for="eddySize"></output>
    <input type="range" data-config="eddySize" min="60" max="800" step="10" data-digits="0" data-suffix="px">
  </label>
  <label>
    <span>Eddy depth (eddyDepth)</span>
    <output data-for="eddyDepth"></output>
    <input type="range" data-config="eddyDepth" min="20" max="300" step="5" data-digits="0" data-suffix="px">
  </label>
  <label>
    <span>Eddy build-up (eddyBuildMs)</span>
    <output data-for="eddyBuildMs"></output>
    <input type="range" data-config="eddyBuildMs" min="0" max="3000" step="50" data-digits="0" data-suffix="ms">
  </label>
  <label>
    <span>All torn off after (detachFullMs)</span>
    <output data-for="detachFullMs"></output>
    <input type="range" data-config="detachFullMs" min="500" max="20000" step="250" data-digits="0" data-suffix="ms">
  </label>
  <label>
    <span>Tear-off speed (detachSpeed)</span>
    <output data-for="detachSpeed"></output>
    <input type="range" data-config="detachSpeed" min="0.3" max="8" step="0.1">
  </label>
  <label>
    <span>Big glyphs first (detachSizeBias)</span>
    <output data-for="detachSizeBias"></output>
    <input type="range" data-config="detachSizeBias" min="0" max="20" step="0.5">
  </label>
</div>
<!-- Tuning panels on the right stack in a column that scrolls if needed. -->
<div class="dev-col">
<!-- Temporary: motion blur playground. -->
<div class="tuning mb-panel" id="mb-panel" aria-label="Motion blur (temporary)" hidden>
  <h2 class="mb-title">Motion blur <span>(temporary)</span></h2>
  <label class="switch-row">
    <span>On (mbOn)</span>
    <input type="checkbox" id="mb-on" role="switch" checked>
  </label>
  <label>
    <span>Shutter (mbShutter)</span>
    <output data-for="mbShutter"></output>
    <input type="range" data-config="mbShutter" min="0" max="0.1" step="0.005" data-digits="3" data-suffix="s">
  </label>
  <label>
    <span>Samples (mbSamples)</span>
    <output data-for="mbSamples"></output>
    <input type="range" data-config="mbSamples" min="2" max="6" step="1" data-digits="0">
  </label>
  <label>
    <span>Min speed (mbMinSpeed)</span>
    <output data-for="mbMinSpeed"></output>
    <input type="range" data-config="mbMinSpeed" min="0" max="600" step="10" data-digits="0">
  </label>
  <label>
    <span>Max length (mbMaxLen)</span>
    <output data-for="mbMaxLen"></output>
    <input type="range" data-config="mbMaxLen" min="10" max="250" step="5" data-digits="0" data-suffix="px">
  </label>
  <label>
    <span>Smear opacity (mbTail)</span>
    <output data-for="mbTail"></output>
    <input type="range" data-config="mbTail" min="0.05" max="1" step="0.05" data-format="percent">
  </label>
  <label>
    <span>Frame trails (mbTrails)</span>
    <output data-for="mbTrails"></output>
    <input type="range" data-config="mbTrails" min="0" max="0.95" step="0.05" data-format="percent">
  </label>
</div>
<!-- Size ramp: how glyphs grow toward the cursor. -->
<div class="tuning ramp-panel" id="ramp-panel" aria-label="Size ramp" hidden>
  <h2 class="mb-title">Size ramp</h2>
  <label>
    <span>Largest size (maxSize)</span>
    <output data-for="maxSize"></output>
    <input type="range" data-config="maxSize" min="4" max="30" step="0.5" data-suffix="px">
  </label>
  <label>
    <span>Resting size (minSize)</span>
    <output data-for="minSize"></output>
    <input type="range" data-config="minSize" min="0.5" max="10" step="0.1" data-suffix="px">
  </label>
  <label>
    <span>Full-size depth (inner)</span>
    <output data-for="inner"></output>
    <input type="range" data-config="inner" min="0" max="200" step="1" data-digits="0" data-suffix="px">
  </label>
  <label>
    <span>Reach outside edge (outer)</span>
    <output data-for="outer"></output>
    <input type="range" data-config="outer" min="0" max="300" step="1" data-digits="0" data-suffix="px">
  </label>
  <label>
    <span>Curve (rampCurve)</span>
    <output data-for="rampCurve"></output>
    <input type="range" data-config="rampCurve" min="0.2" max="4" step="0.05" data-digits="2">
  </label>
  <label>
    <span>Shape size (shapeSize)</span>
    <output data-for="shapeSize"></output>
    <input type="range" data-config="shapeSize" min="120" max="900" step="5" data-digits="0" data-suffix="px">
  </label>
</div>
</div>
<script src="engine.js"></script>
<script>
  // Playground: the full-window version with every control. The effect lives
  // in engine.js; this page only builds the UI around it.
  const gb = Glyphbomb.mount(document.getElementById('stage'), {
    keys: window,
    wheel: window,
    shakeEls: [document.querySelector('.menu'), document.querySelector('.side')],
  });
  const CONFIG = gb.config;

  // Frame rate readout.
  const fpsEl = document.getElementById('fps');
  gb.on('fps', n => { fpsEl.textContent = `${n} fps`; });

  // Action keys: build each key's lit state (a 50% white fill with the
  // letters masked out), then light them as actions fire.
  document.querySelectorAll('.action kbd').forEach((kbd, n) => {
    const r = kbd.getBoundingClientRect();
    const wv = r.width + 2, hv = r.height + 2, id = 'ko' + n;
    const txt = kbd.textContent.trim();
    const cs = getComputedStyle(kbd);
    kbd.insertAdjacentHTML('beforeend',
      `<svg viewBox="0 0 ${wv} ${hv}" aria-hidden="true"><defs><mask id="${id}">` +
      `<rect width="${wv}" height="${hv}" rx="5" fill="#fff"/>` +
      `<text x="50%" y="50%" text-anchor="middle" dominant-baseline="central" fill="#000" ` +
      `style="font-family:${cs.fontFamily.replace(/"/g, "'")};font-size:${cs.fontSize}">${txt}</text>` +
      `</mask></defs><rect width="${wv}" height="${hv}" rx="5" fill="rgba(255,255,255,0.5)" mask="url(#${id})"/></svg>`);
  });
  function flash(id) {
    const el = document.getElementById(id);
    el.classList.remove('fire');
    el.offsetWidth; // restart
    el.classList.add('fire');
    clearTimeout(el._t);
    el._t = setTimeout(() => el.classList.remove('fire'), 50);
  }
  gb.on('action', a => flash({ click: 'k-click', space: 'k-space', esc: 'k-esc' }[a]));
  gb.on('shift', on => document.getElementById('k-shift').classList.toggle('fire', on));
  gb.on('scrolling', on => document.getElementById('k-scroll').classList.toggle('fire', on));

  // Secret: ` shows or hides the tuning panels.
  gb.on('secret', () => {
    const panels = ['mb-panel', 'ramp-panel', 'wind-panel'].map(id => document.getElementById(id));
    const show = panels[0].hidden;
    panels.forEach(p => { p.hidden = !show; });
  });

  // Mode menu (Z Repulse, X Attract).
  const modeKey = { repulse: 'z', attract: 'x' };
  document.querySelectorAll('.menu [data-key]').forEach(btn => {
    btn.addEventListener('click', () => {
      gb.toggleMode(btn.dataset.key === 'z' ? 'repulse' : 'attract');
      btn.blur();
    });
  });

  // Variables panel: shows the active mode's sliders. It starts closed and
  // only opens from its title. The chosen open state carries across Repulse
  // and Attract; with neither on it closes, its title faded and inert, and
  // reopens as it was when one comes back on.
  let userOpen = false;
  let panelMode = 'z';
  const head = document.querySelector('.tuning-head');
  const panelBody = document.querySelector('.tuning-body');
  const tumbleBox = document.getElementById('tumble');
  const orientBox = document.getElementById('orient');
  const mbBox = document.getElementById('mb-on');
  function setPanelOpen(open) {
    panelBody.classList.toggle('open', open);
    head.setAttribute('aria-expanded', String(open));
    head.querySelector('.chev').textContent = open ? '–' : '+';
  }
  function updateUI() {
    const mode = gb.mode;
    // Menu buttons.
    for (const [m, k] of Object.entries(modeKey)) {
      const btn = document.querySelector(`.menu [data-key="${k}"]`);
      const on = mode === m;
      btn.setAttribute('aria-pressed', String(on));
      btn.querySelector('.state').textContent = on ? 'on' : 'off';
    }
    const active = mode ? modeKey[mode] : null;
    if (active) panelMode = active;
    head.disabled = !active;
    tumbleBox.disabled = !active;
    tumbleBox.checked = gb.get('tumble');
    orientBox.disabled = !active;
    orientBox.checked = gb.get('orient');
    const inner = document.querySelector('.tuning-inner');
    const groups = [...document.querySelectorAll('.tuning-group')];
    const shown = groups.find(g => !g.hidden);
    const swapping = shown && shown.dataset.mode !== panelMode && panelBody.classList.contains('open');
    const from = inner.offsetHeight;
    groups.forEach(g => {
      g.hidden = g.dataset.mode !== panelMode;
      g.querySelectorAll('input').forEach(inp => { inp.disabled = !active; });
    });
    if (swapping) {
      // Ease from the old sliders' height to the new ones', and fade them in.
      const next = groups.find(g => !g.hidden);
      const to = inner.scrollHeight;
      inner.classList.remove('resizing');
      inner.style.height = from + 'px';
      next.classList.add('entering');
      inner.offsetHeight; // apply the start height before transitioning
      inner.classList.add('resizing');
      inner.style.height = to + 'px';
      requestAnimationFrame(() => next.classList.remove('entering'));
      clearTimeout(inner._t);
      inner._t = setTimeout(() => {
        inner.classList.remove('resizing');
        inner.style.height = '';
      }, 360);
    }
    setPanelOpen(active ? userOpen : false);
  }
  gb.on('change', updateUI);
  tumbleBox.addEventListener('change', () => { gb.set('tumble', tumbleBox.checked); tumbleBox.blur(); });
  orientBox.addEventListener('change', () => { gb.set('orient', orientBox.checked); orientBox.blur(); });
  mbBox.checked = CONFIG.mbOn;
  mbBox.addEventListener('change', () => { CONFIG.mbOn = mbBox.checked; mbBox.blur(); });
  head.addEventListener('click', () => {
    userOpen = !panelBody.classList.contains('open');
    setPanelOpen(userOpen);
    head.blur();
  });
  setPanelOpen(false);
  updateUI();

  // Sliders write straight into the engine's settings, applied next frame.
  document.querySelectorAll('.tuning [data-config]').forEach(input => {
    const name = input.dataset.config;
    const out = document.querySelector(`.tuning [data-for="${name}"]`);
    const show = () => {
      const v = Number(CONFIG[name]);
      const fmt = input.dataset.format;
      out.textContent = fmt === 'percent' ? Math.round(v * 100) + '%'
        : fmt === 'millions' ? (v / 1e6).toFixed(1) + 'M'
        : v.toFixed(Number(input.dataset.digits || 1)) + (input.dataset.suffix || '');
    };
    // Filled part of the track, for browsers without a native progress fill.
    const fill = () => {
      const pct = (input.value - input.min) / (input.max - input.min) * 100;
      input.style.setProperty('--fill', pct + '%');
    };
    input.value = CONFIG[name];
    show();
    fill();
    input.addEventListener('input', () => {
      fill();
      CONFIG[name] = parseFloat(input.value);
      // Keep blur's full point above its start.
      if (name === 'blurStart') CONFIG.blurFull = Math.max(CONFIG.blurFull, CONFIG.blurStart + 1);
      show();
    });
  });
</script>
</body>
</html>
